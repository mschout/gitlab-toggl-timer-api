name: Build and Publish Docker Image

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REF: ${{ github.event.workflow_run.head_sha || github.ref }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          repo_lc="${IMAGE_NAME,,}"
          image_base="${REGISTRY}/${repo_lc}"
          version="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            primary="${image_base}:${GITHUB_REF#refs/tags/v}"
            extra="${image_base}:latest"
          else
            primary="${image_base}:${version}-${SOURCE_SHA::7}"
            extra="${image_base}:main"
          fi
          {
            echo "primary=$primary"
            echo "extra=$extra"
            echo "image_base=$image_base"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        env:
          IMAGE_NAME: ${{ steps.tags.outputs.primary }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew bootBuildImage --publishImage --environment BP_JVM_AOTCACHE_ENABLED=true

      - name: Tag and push additional tag
        run: |
          docker tag "${{ steps.tags.outputs.primary }}" "${{ steps.tags.outputs.extra }}"
          docker push "${{ steps.tags.outputs.extra }}"
