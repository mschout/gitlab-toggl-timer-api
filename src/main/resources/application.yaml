spring:
  application:
    name: gitlab-toggl-timer

  docker:
    compose:
      file: compose-dev.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gitlab_toggl_timer}
    username: ${DB_USERNAME:gitlab_toggl_timer}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-name: ${OIDC_CLIENT_NAME:Single Sign-On}
            provider: oidc
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}

app:
  encryption:
    password: ${APP_ENCRYPTION_PASSWORD}
    salt: ${APP_ENCRYPTION_SALT}
  auth:
    password-login-enabled: ${APP_AUTH_PASSWORD_LOGIN_ENABLED:true}

logging:
  level:
    org.hobsoft.spring.resttemplatelogger.LoggingCustomizer: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
