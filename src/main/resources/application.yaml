spring:
  application:
    name: gitlab-toggl-timer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gitlab_toggl_timer}
    username: ${DB_USERNAME:gitlab_toggl_timer}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

gitlab:
  accessToken: ${GITLAB_ACCESS_TOKEN}

toggl:
  apiKey: ${TOGGL_API_KEY}

logging:
  level:
    org.hobsoft.spring.resttemplatelogger.LoggingCustomizer: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
