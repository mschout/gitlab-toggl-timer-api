<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Home', ~{::main})}"
  lang="en"
>
  <body>
    <main>
      <section class="mb-4">
        <h1 class="display-6 mb-1">
          <i class="bi bi-stopwatch text-primary me-2"></i>Gitlab Toggl Timer
        </h1>
        <p class="lead text-body-secondary mb-0" th:text="${message}">Welcome</p>
      </section>

      <div id="result" class="mb-4"></div>

      <div th:fragment="timer-form" id="timer-form-card" class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 card-title mb-3">
            <i class="bi bi-bullseye me-2"></i>Track time on a GitLab issue
          </h2>
          <p class="text-body-secondary small mb-4">
            Paste a GitLab issue URL and choose your Toggl workspace + client. Use
            <strong>Create Project</strong> to set up a Toggl project for the issue, or
            <strong>Start Timer</strong> to begin tracking time immediately.
          </p>

          <div
            th:if="${togglFetchError != null}"
            class="alert alert-warning"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle me-1"></i>
            <span th:text="${togglFetchError}"></span>
            Enter IDs manually below.
          </div>

          <form th:object="${form}" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label for="issueUrl" class="form-label">GitLab issue URL</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                  <input
                    type="url"
                    id="issueUrl"
                    class="form-control"
                    th:field="*{issueUrl}"
                    th:errorclass="is-invalid"
                    placeholder="https://gitlab.com/group/project/-/issues/42"
                    autocomplete="off"
                    required
                  />
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('issueUrl')}"
                    th:errors="*{issueUrl}"
                  ></div>
                </div>
              </div>

              <div class="col-md-6">
                <label for="workspaceId" class="form-label">Toggl workspace</label>
                <input
                  th:if="${togglFetchError != null}"
                  type="number"
                  id="workspaceId"
                  class="form-control"
                  th:field="*{workspaceId}"
                  th:errorclass="is-invalid"
                  min="1"
                  required
                />
                <select
                  th:if="${togglFetchError == null}"
                  id="workspaceId"
                  class="form-select"
                  th:field="*{workspaceId}"
                  th:errorclass="is-invalid"
                  hx-get="/timer/clients"
                  hx-trigger="change"
                  hx-target="#client-select-wrapper"
                  hx-swap="outerHTML"
                  hx-include="this"
                  required
                >
                  <option value="">Select a workspace…</option>
                  <option
                    th:each="ws : ${workspaces}"
                    th:value="${ws.id}"
                    th:text="${ws.name}"
                  ></option>
                </select>
                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('workspaceId')}"
                  th:errors="*{workspaceId}"
                ></div>
              </div>

              <div th:fragment="client-select" id="client-select-wrapper" class="col-md-6">
                <label for="clientId" class="form-label">Toggl client</label>
                <div
                  th:if="${clientsFetchError != null}"
                  class="alert alert-warning py-2 mb-2"
                  role="alert"
                  th:text="${clientsFetchError}"
                ></div>
                <input
                  th:if="${togglFetchError != null or clientsFetchError != null}"
                  type="number"
                  id="clientId"
                  name="clientId"
                  class="form-control"
                  th:value="${form?.clientId}"
                  min="1"
                  required
                />
                <select
                  th:if="${togglFetchError == null and clientsFetchError == null}"
                  id="clientId"
                  name="clientId"
                  class="form-select"
                  required
                >
                  <option value="">Select a client…</option>
                  <option
                    th:each="c : ${clients}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:selected="${form != null and form.clientId != null and form.clientId == c.id}"
                  ></option>
                </select>
              </div>

              <div class="col-12">
                <label for="description" class="form-label">
                  Description
                  <span class="text-body-secondary fw-normal">(optional, used by Start Timer)</span>
                </label>
                <input
                  type="text"
                  id="description"
                  class="form-control"
                  th:field="*{description}"
                  placeholder="What are you working on?"
                />
              </div>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2 mt-4">
              <button
                type="submit"
                class="btn btn-outline-primary"
                hx-post="/timer/create-project"
                hx-target="#result"
                hx-swap="innerHTML"
                hx-indicator="#timer-spinner"
              >
                <i class="bi bi-folder-plus me-1"></i>Create Project
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                hx-post="/timer/start"
                hx-target="#result"
                hx-swap="innerHTML"
                hx-indicator="#timer-spinner"
              >
                <i class="bi bi-play-circle me-1"></i>Start Timer
              </button>
              <span
                id="timer-spinner"
                class="htmx-indicator d-inline-flex align-items-center text-body-secondary small"
              >
                <span
                  class="spinner-border spinner-border-sm text-primary me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Working&hellip;
              </span>
            </div>
          </form>
        </div>
      </div>

      <script>
        (function () {
          var STORAGE_KEY = 'gitlabTogglTimer.timer.selectedClient';

          function getWorkspaceId() {
            var el = document.getElementById('workspaceId');
            return el && el.value ? el.value : null;
          }

          function readStored() {
            try {
              var raw = localStorage.getItem(STORAGE_KEY);
              return raw ? JSON.parse(raw) : null;
            } catch (e) {
              return null;
            }
          }

          function writeStored(workspaceId, clientId) {
            try {
              localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({ workspaceId: String(workspaceId), clientId: String(clientId) })
              );
            } catch (e) {}
          }

          function clearStored() {
            try {
              localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
          }

          function restoreClientSelection() {
            var clientEl = document.getElementById('clientId');
            if (!clientEl) return;
            if (clientEl.value) return;
            var workspaceId = getWorkspaceId();
            if (!workspaceId) return;
            var stored = readStored();
            if (!stored || stored.workspaceId !== String(workspaceId)) return;
            var clientId = String(stored.clientId);
            if (clientEl.tagName === 'SELECT') {
              for (var i = 0; i < clientEl.options.length; i++) {
                if (clientEl.options[i].value === clientId) {
                  clientEl.value = clientId;
                  return;
                }
              }
            } else {
              clientEl.value = clientId;
            }
          }

          document.addEventListener('DOMContentLoaded', restoreClientSelection);

          document.addEventListener('change', function (evt) {
            var target = evt.target;
            if (!target || !target.id) return;
            if (target.id === 'clientId') {
              var workspaceId = getWorkspaceId();
              if (workspaceId && target.value) {
                writeStored(workspaceId, target.value);
              } else {
                clearStored();
              }
            } else if (target.id === 'workspaceId') {
              clearStored();
            }
          });

          document.body.addEventListener('htmx:afterSwap', function (evt) {
            var tgt = evt.detail && evt.detail.target;
            if (tgt && tgt.id === 'client-select-wrapper') {
              restoreClientSelection();
            }
          });
        })();
      </script>
    </main>
  </body>
</html>
