<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Timer Stopped', ~{::main})}"
  lang="en"
>
  <body>
    <main>
      <div th:replace="~{::result-card}" th:remove="tag"></div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/timer}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>
    </main>

    <div th:fragment="result-card">
      <div
        th:if="${stopped}"
        class="alert alert-success alert-dismissible fade show js-auto-dismiss"
        role="alert"
      >
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>
          Timer stopped &mdash;
          <strong th:text="${durationFormatted}">00:00:00</strong>
          elapsed.
        </span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      <div
        th:unless="${stopped}"
        class="alert alert-warning alert-dismissible fade show js-auto-dismiss"
        role="alert"
      >
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span>No Toggl timer was running.</span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      <script>
        (function () {
          var alerts = document.querySelectorAll('.alert.js-auto-dismiss');
          alerts.forEach(function (el) {
            setTimeout(function () {
              if (window.bootstrap && window.bootstrap.Alert) {
                var instance = window.bootstrap.Alert.getOrCreateInstance(el);
                instance.close();
              } else if (el.parentNode) {
                el.parentNode.removeChild(el);
              }
            }, 5000);
          });
        })();
      </script>
    </div>
  </body>
</html>
