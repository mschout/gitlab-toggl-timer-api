<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Timer Stopped', ~{::main}, ~{fragments/timer-assets :: styles}, ~{fragments/timer-assets :: scripts})}"
  lang="en"
>
  <body>
    <main>
      <div th:replace="~{::result-card}" th:remove="tag"></div>

      <div th:replace="~{timer-index :: time-totals}" th:remove="tag"></div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/timer}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>

    </main>

    <form
      th:fragment="result-card"
      class="running-timer-toolbar running-timer-toolbar-stopped shadow-sm"
      role="region"
      aria-label="Stopped timer"
    >
      <input
        th:if="${stoppedTimer.workspaceId != null}"
        type="hidden"
        name="workspaceId"
        th:value="${stoppedTimer.workspaceId}"
      />

      <div class="running-timer-description">
        <input
          type="text"
          name="description"
          class="stopped-timer-description"
          placeholder="What are you working on?"
          aria-label="Time entry description"
          autocomplete="off"
        />
      </div>

      <label class="stopped-timer-project">
        <i class="bi bi-folder-fill" aria-hidden="true"></i>
        <span class="visually-hidden">Project</span>
        <select
          name="projectId"
          class="js-stopped-project"
          aria-label="Project"
          th:disabled="${stoppedTimer.workspaceId == null}"
        >
          <option value="">No project</option>
          <option
            th:each="project : ${stoppedTimer.projects}"
            th:value="${project.togglId}"
            th:text="${project.clientName != null} ? |${project.name} • ${project.clientName}| : ${project.name}"
            th:attr="data-project-color=${project.color}"
          >Project</option>
        </select>
      </label>

      <time class="running-timer-elapsed" aria-label="Elapsed time">00:00:00</time>

      <button
        type="submit"
        class="btn btn-success running-timer-action running-timer-start"
        hx-post="/timer/start"
        hx-target="#result"
        hx-swap="innerHTML"
        th:disabled="${stoppedTimer.workspaceId == null}"
        aria-label="Start timer"
        title="Start timer"
      >
        <i class="bi bi-play-fill" aria-hidden="true"></i>
      </button>
      <div class="running-timer-actions-slot" aria-hidden="true"></div>
    </form>
  </body>
</html>
