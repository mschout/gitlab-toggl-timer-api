<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|${title} - Gitlab Toggl Timer|">Gitlab Toggl Timer</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="container py-4 flex-grow-1">
      <div th:replace="~{fragments/flash :: flash(${flash})}" th:remove="tag"></div>
      <div th:replace="${content}"></div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/2.0.10/dist/htmx.min.js}"></script>
  </body>
</html>
