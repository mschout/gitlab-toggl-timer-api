<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="layout(title, content)"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|${title} • Gitlab Toggl Timer|">Gitlab Toggl Timer</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/air-datepicker/3.6.0/air-datepicker.css}" />
    <link rel="stylesheet" th:href="${staticResourceUrls.appStylesheet}" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="container py-4 flex-grow-1">
      <div th:replace="~{fragments/flash :: flash(${flash})}" th:remove="tag"></div>
      <div th:replace="${content}"></div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <div
      sec:authorize="isAuthenticated() and !hasAuthority('ROLE_PRE_MFA')"
      class="d-none"
      th:attr="hx-post=@{/auth/keep-alive}"
      hx-trigger="every 5m"
      hx-swap="none"
      aria-hidden="true"
    ></div>

    <script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/air-datepicker/3.6.0/air-datepicker.js}"></script>
    <script th:src="@{/webjars/htmx.org/4.0.0/dist/htmx.min.js}"></script>
    <script defer th:src="${staticResourceUrls.baseScript}"></script>
  </body>
</html>
