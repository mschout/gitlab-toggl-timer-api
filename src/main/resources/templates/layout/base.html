<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="layout(title, content)"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|${title} • Gitlab Toggl Timer|">Gitlab Toggl Timer</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="container py-4 flex-grow-1">
      <div th:replace="~{fragments/flash :: flash(${flash})}" th:remove="tag"></div>
      <div th:replace="${content}"></div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <div
      sec:authorize="isAuthenticated() and !hasAuthority('ROLE_PRE_MFA')"
      class="d-none"
      th:attr="hx-post=@{/auth/keep-alive}"
      hx-trigger="every 5m"
      hx-swap="none"
      aria-hidden="true"
    ></div>

    <script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/4.0.0/dist/htmx.min.js}"></script>
    <script>
      document.body.addEventListener('htmx:config:request', function (evt) {
        var token = document.querySelector('meta[name="_csrf"]').content;
        var header = document.querySelector('meta[name="_csrf_header"]').content;
        if (token && header) {
          evt.detail.ctx.request.headers[header] = token;
        }
      });

      function scheduleAutoDismissAlerts(root) {
        if (!root || !root.querySelectorAll) return;
        var alerts = [];
        if (root.matches && root.matches('[data-auto-dismiss-after]')) alerts.push(root);
        root.querySelectorAll('[data-auto-dismiss-after]').forEach(function (alert) {
          alerts.push(alert);
        });
        alerts.forEach(function (alert) {
          if (alert.dataset.autoDismissScheduled === 'true') return;
          var delay = Number.parseInt(alert.dataset.autoDismissAfter, 10);
          if (!Number.isFinite(delay) || delay < 0) return;
          alert.dataset.autoDismissScheduled = 'true';
          window.setTimeout(function () {
            if (!alert.isConnected) return;
            bootstrap.Alert.getOrCreateInstance(alert).close();
          }, delay);
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        scheduleAutoDismissAlerts(document);
      });

      document.body.addEventListener('htmx:after:swap', function (evt) {
        var ctx = evt.detail && evt.detail.ctx;
        var target = ctx && ctx.target;
        if (typeof target === 'string') target = document.querySelector(target);
        scheduleAutoDismissAlerts(target || document);
      });
    </script>
  </body>
</html>
