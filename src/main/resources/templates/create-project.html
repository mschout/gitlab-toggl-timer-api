<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Project Created', ~{::main}, ~{}, ~{})}"
  lang="en"
>
  <body>
    <main>
      <div th:replace="~{::success-alert}" th:remove="tag"></div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/timer}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>
    </main>

    <div
      th:fragment="success-alert"
      class="alert alert-success alert-dismissible fade show shadow-sm mb-3"
      role="status"
      data-auto-dismiss-after="5000"
    >
      <i class="bi bi-folder-check me-2" aria-hidden="true"></i>
      <span class="fw-semibold">Project ready.</span>
      <span th:text="|${project.name} is ready to track.|">The project is ready to track.</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
  </body>
</html>
