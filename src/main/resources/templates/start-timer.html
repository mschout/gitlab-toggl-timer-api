<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Timer Started', ~{::main})}"
  lang="en"
>
  <body>
    <main>
      <div th:replace="~{::result-card}" th:remove="tag"></div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/timer}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>
    </main>

    <div th:fragment="result-card" class="card border-success shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-start gap-3">
          <i class="bi bi-play-circle-fill text-success display-6"></i>
          <div class="flex-grow-1">
            <h2 class="h5 card-title mb-1">Timer running</h2>
            <p class="text-body-secondary small mb-3">
              Toggl is tracking time on this project.
            </p>
            <dl class="row mb-0 small">
              <dt class="col-sm-3 text-body-secondary">Started at</dt>
              <dd class="col-sm-9 mb-1">
                <time
                  class="js-local-time"
                  th:attr="datetime=${startTime}"
                  th:text="${startTime}"
                  >2026-05-09T12:00:00Z</time
                >
              </dd>
              <dt class="col-sm-3 text-body-secondary" th:if="${projectName != null}">Project</dt>
              <dd
                class="col-sm-9 mb-1"
                th:if="${projectName != null}"
                th:text="${projectName}"
              >
                Project name
              </dd>
              <dt
                class="col-sm-3 text-body-secondary"
                th:if="${description != null and !#strings.isEmpty(description)}"
              >
                Description
              </dt>
              <dd
                class="col-sm-9 mb-0"
                th:if="${description != null and !#strings.isEmpty(description)}"
                th:text="${description}"
              >
                Description
              </dd>
            </dl>
            <script>
              (function () {
                var fmt = new Intl.DateTimeFormat(undefined, {
                  dateStyle: 'medium',
                  timeStyle: 'medium',
                });
                document.querySelectorAll('time.js-local-time').forEach(function (el) {
                  var iso = el.getAttribute('datetime');
                  if (!iso) return;
                  var d = new Date(iso);
                  if (isNaN(d.getTime())) return;
                  el.textContent = fmt.format(d);
                });
              })();
            </script>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
