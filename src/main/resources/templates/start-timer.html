<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Timer Started', ~{::main})}"
  lang="en"
>
  <body>
    <main>
      <div th:replace="~{::result-card}" th:remove="tag"></div>

      <div th:replace="~{timer-index :: time-totals}" th:remove="tag"></div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/timer}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>

      <script th:replace="~{timer-index :: timer-script}"></script>
    </main>

    <div
      th:fragment="result-card"
      class="running-timer-toolbar shadow-sm"
      th:style="${runningTimer.projectPicker.projectColor != null} ? |--project-color: ${runningTimer.projectPicker.projectColor}| : null"
      role="region"
      aria-label="Running timer"
    >
      <div class="running-timer-description">
        <th:block th:with="descriptionEditor=${runningTimer.descriptionEditor}">
          <span th:replace="~{fragments/time-entry-description :: description-editor}"></span>
        </th:block>
      </div>

      <div class="running-timer-project">
        <th:block th:with="projectPicker=${runningTimer.projectPicker}">
          <div th:replace="~{fragments/time-entry-project :: project-picker}"></div>
        </th:block>
      </div>

      <time
        class="running-timer-elapsed js-elapsed-time"
        th:attr="data-started-at=${runningTimer.startTime}"
      >--:--:--</time>

      <button
        type="button"
        class="btn btn-danger running-timer-action running-timer-stop"
        hx-post="/timer/stop"
        hx-target="#result"
        hx-swap="innerHTML"
        aria-label="Stop timer"
        title="Stop timer"
      >
        <i class="bi bi-stop-fill" aria-hidden="true"></i>
      </button>
    </div>
  </body>
</html>
