<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('Sign in', ~{::main}, ~{}, ~{})}"
  lang="en"
>
  <body>
    <main>
      <section class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
              </h1>

              <div class="alert alert-danger" th:if="${param.error}" role="alert">
                Invalid credentials.
              </div>
              <div class="alert alert-success" th:if="${param.logout}" role="alert">
                You have been signed out.
              </div>

              <form
                th:if="${passwordLoginEnabled}"
                th:action="@{/login}"
                method="post"
                class="mb-3"
              >
                <div class="mb-3">
                  <label class="form-label" for="username">Email</label>
                  <input
                    class="form-control"
                    type="email"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="password">Password</label>
                  <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                  />
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                </button>
              </form>

              <div th:if="${!#lists.isEmpty(oidcProviders)}">
                <hr th:if="${passwordLoginEnabled}" />
                <div class="d-grid gap-2">
                  <a
                    th:each="provider : ${oidcProviders}"
                    class="btn btn-outline-secondary"
                    th:href="@{|/oauth2/authorization/${provider.id}|}"
                  >
                    <i class="bi bi-shield-lock me-1"></i>
                    <span th:text="|Sign in with ${provider.name}|">Sign in with SSO</span>
                  </a>
                </div>
              </div>

              <hr />
              <div class="d-grid">
                <button
                  class="btn btn-outline-primary"
                  type="button"
                  id="passkey-signin-btn"
                  data-passkey-login
                >
                  <i class="bi bi-fingerprint me-1"></i>Sign in with a passkey
                </button>
                <p class="small text-danger mt-2 d-none" id="passkey-signin-error"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <script th:src="@{/login/webauthn.js}"></script>
      <script defer th:src="${staticResourceUrls.loginScript}"></script>
    </main>
  </body>
</html>
