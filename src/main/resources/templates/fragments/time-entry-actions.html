<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="entry-actions"
      class="time-entry-actions"
      th:id="|time-entry-actions-${entryActions.togglId}|"
    >
      <div class="dropdown">
        <button
          type="button"
          class="time-entry-actions-trigger"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside"
          aria-expanded="false"
          aria-haspopup="menu"
          th:attr="aria-label=${entryActions.description != null} ? |Actions for ${entryActions.description}| : 'Actions for untitled time entry'"
        >
          <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end time-entry-actions-menu" role="menu">
          <li role="none">
            <button
              type="button"
              class="dropdown-item time-entry-copy-description"
              role="menuitem"
              th:disabled="${entryActions.description == null}"
              th:attr="data-description=${entryActions.description}"
            >
              <i class="bi bi-copy" aria-hidden="true"></i>
              <span class="time-entry-copy-label">Copy description</span>
            </button>
          </li>
          <li th:if="${entryActions.split != null}" role="none">
            <button
              type="button"
              class="dropdown-item time-entry-split-trigger"
              role="menuitem"
              th:disabled="${entryActions.splitDisabledReason != null}"
              th:title="${entryActions.splitDisabledReason}"
              th:attr="aria-controls=|time-entry-split-dialog-${entryActions.togglId}|,
                       aria-describedby=${entryActions.splitDisabledReason != null} ? |time-entry-split-disabled-${entryActions.togglId}| : null"
              aria-haspopup="dialog"
            >
              <i class="bi bi-scissors" aria-hidden="true"></i>
              <span>Split</span>
            </button>
            <span
              th:if="${entryActions.splitDisabledReason != null}"
              class="visually-hidden"
              th:id="|time-entry-split-disabled-${entryActions.togglId}|"
              th:text="${entryActions.splitDisabledReason}"
            >Split is unavailable.</span>
          </li>
          <li role="separator"><hr class="dropdown-divider" /></li>
          <li role="none">
            <button
              type="button"
              class="dropdown-item text-danger time-entry-delete-trigger"
              role="menuitem"
              th:disabled="${entryActions.deleteDisabledReason != null}"
              th:title="${entryActions.deleteDisabledReason}"
              th:attr="aria-controls=|time-entry-delete-dialog-${entryActions.togglId}|"
              aria-haspopup="dialog"
            >
              <i class="bi bi-trash3" aria-hidden="true"></i>
              <span>Delete</span>
            </button>
          </li>
        </ul>
      </div>

      <th:block th:if="${entryActions.split != null}" th:with="split=${entryActions.split}">
        <dialog th:replace="~{fragments/time-entry-split :: split-dialog}"></dialog>
      </th:block>

      <dialog
        class="time-entry-delete-dialog"
        th:id="|time-entry-delete-dialog-${entryActions.togglId}|"
        th:attr="aria-labelledby=|time-entry-delete-title-${entryActions.togglId}|,
                 data-open=${entryActions.open}"
      >
        <div class="time-entry-delete-dialog-header">
          <div>
            <div class="time-entry-delete-kicker">Permanent action</div>
            <h3
              class="time-entry-delete-title"
              th:id="|time-entry-delete-title-${entryActions.togglId}|"
            >
              Delete time entry?
            </h3>
          </div>
          <button
            type="button"
            class="btn-close time-entry-delete-close"
            aria-label="Close"
          ></button>
        </div>
        <div class="time-entry-delete-dialog-body">
          <div
            th:if="${entryActions.error != null}"
            class="time-entry-delete-error"
            role="alert"
            th:text="${entryActions.error}"
          >
            Could not delete this time entry. Try again.
          </div>
          <p
            class="time-entry-delete-description"
            th:text="${entryActions.description != null} ? |“${entryActions.description}” will be removed from Toggl and local history.| : 'This time entry will be removed from Toggl and local history.'"
          >
            This time entry will be removed from Toggl and local history.
          </p>
          <p class="time-entry-delete-warning">This cannot be undone.</p>
        </div>
        <div class="time-entry-delete-dialog-footer">
          <button type="button" class="btn btn-outline-secondary time-entry-delete-close">
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-danger time-entry-delete-confirm"
            th:attr="hx-delete=@{/timer/entries/{togglId}(togglId=${entryActions.togglId})},
                     hx-target=|#time-entry-actions-${entryActions.togglId}|"
            hx-swap="outerHTML"
            hx-disabled-elt="this"
          >
            <span
              class="htmx-indicator spinner-border spinner-border-sm"
              aria-hidden="true"
            ></span>
            <span class="time-entry-delete-confirm-label">Delete</span>
          </button>
        </div>
      </dialog>
    </div>
  </body>
</html>
