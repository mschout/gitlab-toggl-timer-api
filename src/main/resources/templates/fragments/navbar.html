<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  lang="en"
>
  <body>
    <nav
      th:fragment="navbar"
      class="app-navbar navbar navbar-expand-md navbar-dark bg-primary shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
          <i class="bi bi-stopwatch"></i>
          <span>Gitlab Toggl Timer</span>
        </a>
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#primaryNav"
          aria-controls="primaryNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="primaryNav">
          <ul class="navbar-nav ms-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/}">
                <i class="bi bi-house-door me-1"></i>
                Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/timer}">
                <i class="bi bi-stopwatch me-1"></i>
                Timer
              </a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="nav-link" th:href="@{/login}">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Sign in
              </a>
            </li>
          </ul>
        </div>
        <div
          class="dropdown user-menu ms-3"
          sec:authorize="isAuthenticated()"
          th:if="${userProfile != null}"
        >
          <button
            id="userMenuToggle"
            class="user-menu-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-label="User menu"
          >
            <span th:replace="~{fragments/navbar :: avatar('user-avatar')}"></span>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end user-menu-panel"
            aria-labelledby="userMenuToggle"
          >
            <li class="user-menu-header d-flex align-items-center gap-3">
              <span
                th:replace="~{fragments/navbar :: avatar('user-avatar user-avatar-large')}"
              ></span>
              <div class="user-menu-identity">
                <div class="fw-semibold" th:text="${userProfile.email}">user@example.com</div>
                <div
                  class="text-body-secondary"
                  th:if="${userProfile.fullName != null}"
                  th:text="${userProfile.fullName}"
                >
                  Full name
                </div>
              </div>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" th:href="@{/settings}">
                <i class="bi bi-gear me-2" aria-hidden="true"></i>
                Settings
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item">
                  <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                  Logout
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <span th:fragment="avatar(cssClass)" th:class="${cssClass}" aria-hidden="true">
      <i class="bi bi-person-fill"></i>
      <img
        th:if="${userProfile.pictureUrl != null or userProfile.gravatarUrl != null}"
        th:attr="data-avatar-primary=${userProfile.pictureUrl},data-avatar-gravatar=${userProfile.gravatarUrl}"
        class="d-none"
        alt=""
        referrerpolicy="no-referrer"
      />
    </span>
  </body>
</html>
